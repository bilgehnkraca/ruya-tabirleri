name: Google Indexing API Automation

on:
  schedule:
    # Runs at 00:00 UTC (03:00 TSİ) every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  push-urls:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Required to push the updated state back to the repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Create Service Account JSON
        run: |
          echo "${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}" > service-account.json

      - name: Run Indexing Script
        run: npm run index:push

      - name: Commit and Push Updated State
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f scripts/indexing-state.json
          # Only commit if there are changes
          git diff --staged --quiet || (git commit -m "chore: update indexing state [skip ci]" && git push)
