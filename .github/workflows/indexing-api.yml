name: Google Indexing API Automation

on:
  schedule:
    # Runs at 00:00 UTC (03:00 TSİ) every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  push-urls:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Required to push the updated state back to the repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Create Service Account JSON
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: echo "$GCP_SA_KEY" > service-account.json

      - name: Run Google Indexing Script
        run: npm run index:push

      - name: Run IndexNow Script
        run: npm run indexnow:push

      - name: Commit and Push Updated State
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update indexing state [skip ci]"
          file_pattern: 'scripts/indexing-state.json'
          add_options: '-f'
